name: FORMA public | static quality
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  static-check:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: HTML references, sitemap, agent TOML
        run: python tools/check_project.py
      - name: JavaScript syntax
        run: node --check client.js
      - name: Confirm no tracked private order data
        run: |
          if git ls-files | grep -E '(^|/)(data/|server\.py$|.*\.sqlite3?$|.*\.env($|\.)|.*\.key$|\.owner-password$)'; then
            echo 'Private customer/order files cannot enter public FORMA'
            exit 1
          fi
# CI never deploys or sends Telegram drafts; responsive browser review is a
# separate release gate.
